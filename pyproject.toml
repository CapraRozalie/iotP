[project]
name = "iotproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
iotproject = "iot_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "iot_project"
module-root = "src"